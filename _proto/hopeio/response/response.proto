syntax = "proto3";
package response;

import "google/protobuf/any.proto";
import "patch/go.proto";;

//因protoc生成会自动创建包目录，此文件仅供proto文件引用
//生成使用gen.proto文件
option go_package = "github.com/hopeio/protobuf/response";
option java_package = "xyz.hoper.protobuf.response";
option java_multiple_files = true;

message CommonResp {
  int32 code = 1 [(go.field) = {tags:'json:"code"'}];
  string msg = 2;
  google.protobuf.Any data = 3;
}

message RawResp {
  int32 code = 1 [(go.field) = {tags:'json:"code"'}];
  string msg = 2;
  bytes data = 3 ;
}

//返回多语言提示：msg 为 locale key，data 为 key 对应的变量值
message ErrResp {
  int32 code = 1 [(go.field) = {tags:'json:"code"'}];
  string msg = 2;
  map<string, string> data = 3 ;
}

message HttpResponse{
  map<string, string> headers = 1;
  bytes body = 2;
  int32 status = 3;
}
